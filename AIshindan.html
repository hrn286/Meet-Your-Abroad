<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>AI無料診断 | Meet Your Abroad</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/ai-shindan.css">

</head>

<body>

  <header class="fixed-header">
    <a href="index.html">
      <img src="images/aicon.png" class="header-logo" alt="ロゴ">
    </a>
  </header>
  
  <main style="padding-top:120px; text-align:center;">
    <h1>AI無料留学診断</h1>
    <p>いくつか質問に答えるだけで、あなたに合う留学タイプを診断します。</p>
  
    <button id="start-btn">診断を始める</button>
  
    <div id="chat-area" style="display:none; max-width:600px; margin:40px auto;">
      <div id="chat-box" class="result-box"></div>
  
      <div style="display:flex; gap:8px; margin-top:10px;">
        <input id="user-input" type="text" placeholder="ここに入力してね" style="flex:1;">
        <button id="send-btn">送信</button>
      </div>
    </div>
  </main>
  
  <footer class="site-footer">
    <p>© 2025 Meet Your Abroad</p>
  </footer>
  
  <script src="js/AIshindan.js"></script>
