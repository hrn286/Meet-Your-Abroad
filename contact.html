<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONTACT</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/contact.css">
</head>
  
<body class="page-contact">
  <section class="hero">
    <nav class="hero-menu">
      <ul class="nav-menu">
        <li><a href="index.html" class="nav-home">HOME</a></li>
        <li><a href="taikendan.html" class="nav-taikendan">体験談一覧</a></li>
        <li><a href="AIshindan.html" class="nav-ai">AI無料診断</a></li>
        <li><a href="form.html" class="nav-form">記事応募フォーム</a></li>
        <li><a href="contact.html" class="nav-contact">CONTACT</a></li>
        <li><a href="about.html" class="nav-about">ABOUT</a></li>
      </ul>
    </nav>
    
    <img src="images/aicon.png" alt="ロゴ" class="hero-logo">
    <h1 class="hero-title">CONTACT</h1>
  </section>

  <header class="fixed-header">
    <div class="header-left">
      <img src="images/aicon.png" alt="ロゴ" class="header-logo">
    </div>
  </header>

  <main class="contact">
    <p class="contact-lead">
      お問い合わせは以下のフォームからお願いします。
    </p>

    <form id="contact-form"> 
      <div class="form-group">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="message">お問い合わせ内容</label>
        <textarea id="message" name="message" rows="6" required></textarea>
      </div>

      <p class="form-agreement">
        送信することで、
        <a href="terms.html" target="_blank" rel="noopener">利用規約</a> および
        <a href="privacy.html" target="_blank" rel="noopener">プライバシーポリシー</a>
        に同意したものとみなします。
      </p>

      <button type="submit" id="submit" class="btn-primary">
        送信する
      </button>

      <p id="form-status" class="form-status"></p>
    </form>
  </main>
  
  <footer class="site-footer">
    <div class="footer-left">
      <nav class="footer-links">
        <a href="terms.html">利用規約</a>
        <span class="separator">｜</span>
        <a href="privacy.html">プライバシーポリシー</a>
      </nav>  
      <p>© 2025 Meet Your Abroad</p>
    </div>
  
    <div class="footer-right">
      <img src="images/aicon.png" alt="Meet Your Abroad logo">
    </div>
  </footer>
  
  <script src="/js/contact.js"></script>

  <script>
    window.addEventListener("scroll", function() {
      const header = document.querySelector(".fixed-header");
      if (!header) return;
  
      if (window.scrollY > 80) {
        header.style.display = "flex";
      } else {
        header.style.display = "none";
      }
    });
  </script>

  
</body>
</html>
