<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONTACT</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/contact.css">
</head>
  
<body>
  <section class="hero">
    <nav class="hero-menu">
      <ul class="nav-menu">
        <li><a href="index.html">HOME</a></li>
        <li><a href="taikendan.html">体験談一覧</a></li>
        <li><a href="AIshindan.html">AI無料診断</a></li>
        <li><a href="form.html">記事応募フォーム</a></li>
        <li><a href="contact.html">CONTACT</a></li>
        <li><a href="about.html">ABOUT</a></li>
      </ul>
    </nav>
    
    <img src="images/aicon.png" alt="ロゴ" class="hero-logo">
    <h1 class="hero-copy">CONTACT</h1>
  </section>

  <header class="fixed-header">
    <div class="header-left">
      <img src="images/aicon.png" alt="ロゴ" class="header-logo">
    </div>
  </header>

  <main class="contact">
    <p class="contact-lead">
      お問い合わせは以下のフォームからお願いします。
    </p>

    <form id="contact-form">
      <div class="form-group">
        <label for="name">お名前</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div class="form-group">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="message">お問い合わせ内容</label>
        <textarea id="message" name="message" rows="6" required></textarea>
      </div>

      <button type="submit"id="submit" class="btn-primary">
        送信する
      </button>

      <p id="form-status" class="form-status"></p>
    </form>
  </main>
  
  <footer class="site-footer">
    <div class="footer-left">
      <p>© 2025 Meet Your Abroad</p>
    </div>
  
    <div class="footer-right">
      <img src="images/aicon.png" alt="Meet Your Abroad logo">
    </div>
  </footer>
  
  <script src="/js/contact.js"></script>
  
</body>
</html>
