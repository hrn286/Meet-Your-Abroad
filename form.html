<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>記事応募フォーム</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/form.css">

</head>

  
<body class="page-form">
  <section class="hero">
    <nav class="hero-menu">
      <ul class="nav-menu">
        <li><a href="index.html" class="nav-home">HOME</a></li>
        <li><a href="taikendan.html" class="nav-taikendan">体験談一覧</a></li>
        <li><a href="AIshindan.html" class="nav-ai">AI無料診断</a></li>
        <li><a href="form.html" class="nav-form">記事応募フォーム</a></li>
        <li><a href="contact.html" class="nav-contact">CONTACT</a></li>
        <li><a href="about.html" class="nav-about">ABOUT</a></li>
      </ul>
    </nav>
    
    <img src="images/aicon.png" alt="ロゴ" class="hero-logo">
    <h1 class="hero-title">記事応募フォーム</h1>
  </section>

  <header class="fixed-header">
    <div class="header-left">
      <img src="images/aicon.png" alt="ロゴ" class="header-logo">
    </div>
  </header>

  <main class="form-main">
    <p class="form-lead">体験談を募集しております！</p>
        
      <form id="kijioubo-form">
        <div class="form-group">
          <label for="email">メールアドレス</label>
          <input type="email" id="email" name="email" required>
        </div>
  
        <div class="form-group">
          <label for="destination">留学先（国、都市）</label>
          <input id="destination" name="destination" required>
        </div>

        <div class="form-group">
          <label for="period">留学期間</label>
          <input id="period" name="period" required>
        </div>

        <div class="form-group">
          <legend>留学前の言語レベル（留学先で主に使用した外国語）</legend>
          <div class="form-select">
            <label>
              <input type="radio" name="lanlevel_before" value="全く話せない" required>全く話せない
            </label>
           
            <label>
               <input type="radio" name="lanlevel_before" value="挨拶など基本的な会話ができる" required>挨拶など基本的な会話ができる
            </label>
            
            <label>
              <input type="radio" name="lanlevel_before" value="授業などの内容が理解でき、自分の意見も言えるレベル" required>授業などの内容が理解でき、自分の意見も言えるレベル
            </label>
          </div>  
        </div>

        <div class="form-group">
          <legend>留学後の言語レベル</legend>
          <div class="form-select">
            <label>
              <input type="radio" name="lanlevel_after" value="全く話せない" required>全く話せない
            </label>
           
            <label>
               <input type="radio" name="lanlevel_after" value="挨拶など基本的な会話ができる" required>挨拶など基本的な会話ができる
            </label>
            
            <label>
              <input type="radio" name="lanlevel_after" value="授業などの内容が理解でき、自分の意見も言えるレベル" required>授業などの内容が理解でき、自分の意見も言えるレベル
            </label>
          </div>  
        </div>

        <div class="form-group">
          <label for="ready">留学の準備について（特に奨学金、荷物、費用などを書いてもらえると嬉しいです）</label>
          <textarea id="ready" name="ready" rows="6" required></textarea>
        </div>

        <div class="form-group">
          <label for="taikendan">留学体験談（留学決定までの過程、留学中の良かった点や困ったことなど）</label>
          <textarea id="taikendan" name="taikendan" rows="6" required></textarea>
        </div>  

        <div class="form-group">
          <label for="titlesuggest">記事のタイトル案</label>
          <input id="titlesuggest" name="titlesuggest">
        </div>  
  
        <p class="form-agreement">
          送信することで、
          <a href="terms.html" target="_blank" rel="noopener">利用規約</a> および
          <a href="privacy.html" target="_blank" rel="noopener">プライバシーポリシー</a>
          に同意したものとみなします。
        </p>
  
        <button type="submit" id="submit" class="btn-primary">
          送信する
        </button>
  
        <p id="form-status" class="form-status"></p>
      </form>
  </main>
  
  <footer class="site-footer">
    <div class="footer-left">
      <nav class="footer-links">
        <a href="terms.html">利用規約</a>
        <span class="separator">｜</span>
        <a href="privacy.html">プライバシーポリシー</a>
      </nav>
      <p>© 2025 Meet Your Abroad</p>
    </div>
  
    <div class="footer-right">
      <img src="images/aicon.png" alt="Meet Your Abroad logo">
    </div>
  </footer>

  <script>
    window.addEventListener("scroll", function() {
      const header = document.querySelector(".fixed-header");
      if (!header) return;
  
      if (window.scrollY > 80) {
        header.style.display = "flex";
      } else {
        header.style.display = "none";
      }
    });
  </script>

  
</body>
</html>
